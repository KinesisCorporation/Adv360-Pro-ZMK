on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build (Legacy)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          timestamp=$(date +"%Y%m%d%H%M")
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          file_prefix=$timestamp-$commit
          branch_name=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          bin/get_version.sh $branch_name $commit
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('manifest-dir/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build (left)
        run: west build -s zmk/app -d build/left -b adv360_left -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Adv360 Left Kconfig file
        run: grep -vE '(^#|^$)' build/left/zephyr/.config
      - name: West Build (right)
        run: west build -s zmk/app -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Adv360 Right Kconfig file
        run: grep -vE '(^#|^$)' build/right/zephyr/.config
      - name: Rename zmk.uf2
        run: cp build/left/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-left.uf2 && cp build/right/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-right.uf2
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-no-clique
          path: |
            ${{ steps.get_info.outputs.file_prefix }}-left.uf2
            ${{ steps.get_info.outputs.file_prefix }}-right.uf2
  build-clique:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build (Clique)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          timestamp=$(date +"%Y%m%d%H%M")
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          file_prefix=$timestamp-$commit
          branch_name=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          bin/get_version.sh $branch_name $commit clique
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('manifest-dir/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build (left)
        run: west build -s zmk/app -d build/left -b adv360_left -S studio-rpc-usb-uart -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DCONFIG_ZMK_STUDIO=y
      - name: Adv360 Left Kconfig file
        run: grep -vE '(^#|^$)' build/left/zephyr/.config
      - name: West Build (right)
        run: west build -s zmk/app -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Adv360 Right Kconfig file
        run: grep -vE '(^#|^$)' build/right/zephyr/.config
      - name: Rename zmk.uf2
        run: cp build/left/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-left.uf2 && cp build/right/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-right.uf2
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-clique
          path: |
            ${{ steps.get_info.outputs.file_prefix }}-left.uf2
            ${{ steps.get_info.outputs.file_prefix }}-right.uf2

  create-release:
    needs: [build, build-clique]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/latest' || startsWith(github.ref, 'refs/tags/'))
    name: Create Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get release info
        id: release_info
        run: |
          # Get short commit hash
          commit_short=$(echo "${{ github.sha }}" | cut -c1-7)

          # Check if we're on a tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            release_tag="${{ github.ref_name }}"
            release_name="Release ${{ github.ref_name }}"
          else
            # Use commit-based naming for non-tag pushes
            timestamp=$(date +"%Y%m%d%H%M")
            release_tag="v${timestamp}-${commit_short}"
            release_name="Build ${timestamp}-${commit_short}"
          fi

          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          echo "file_prefix=${timestamp}-${commit_short}" >> $GITHUB_OUTPUT

      - name: Download Legacy firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-no-clique
          path: ./firmware-legacy

      - name: Download Clique firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-clique
          path: ./firmware-clique

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Rename files for clarity in release
          for file in firmware-legacy/*.uf2; do
            basename=$(basename "$file")
            # Add 'legacy' identifier
            newname="${basename%-left.uf2}-legacy-left.uf2"
            newname="${newname%-right.uf2}-legacy-right.uf2"
            if [[ "$basename" == *"-left.uf2" ]]; then
              cp "$file" "release-assets/${basename%-left.uf2}-legacy-left.uf2"
            elif [[ "$basename" == *"-right.uf2" ]]; then
              cp "$file" "release-assets/${basename%-right.uf2}-legacy-right.uf2"
            fi
          done

          # Copy clique versions
          for file in firmware-clique/*.uf2; do
            basename=$(basename "$file")
            # Add 'clique' identifier
            if [[ "$basename" == *"-left.uf2" ]]; then
              cp "$file" "release-assets/${basename%-left.uf2}-clique-left.uf2"
            elif [[ "$basename" == *"-right.uf2" ]]; then
              cp "$file" "release-assets/${basename%-right.uf2}-clique-right.uf2"
            fi
          done

          ls -la release-assets/

      - name: Generate release notes
        id: release_notes
        run: |
          echo "## Firmware Build" > release_notes.md
          echo "" >> release_notes.md
          echo "**Commit:** ${{ github.sha }}" >> release_notes.md
          echo "**Branch:** ${{ github.ref_name }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Firmware Files" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Legacy (Standard) Version" >> release_notes.md
          echo "- \`*-legacy-left.uf2\` - Left keyboard firmware" >> release_notes.md
          echo "- \`*-legacy-right.uf2\` - Right keyboard firmware" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Clique (ZMK Studio) Version" >> release_notes.md
          echo "- \`*-clique-left.uf2\` - Left keyboard firmware with ZMK Studio support" >> release_notes.md
          echo "- \`*-clique-right.uf2\` - Right keyboard firmware" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Recent Changes" >> release_notes.md
          echo "" >> release_notes.md
          # Get last 5 commit messages
          git log -5 --pretty=format:"- %s (%h)" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.release_tag }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release-assets/*.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
