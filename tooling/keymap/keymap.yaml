      21: bootloader
      28: studio_unlock
      37: "bt BT_CLR"
      39: "stp STP_BAT"
      50: macro_ver
      69: "bl BL_TOG"
      70: "rgb_ug RGB_TOG"
      71: "bl BL_INC"
      72: "bl BL_DEC"

  # Reserved layers for ZMK Studio
  - name: extra1
    display_name: "Red"
    status: reserved

  - name: extra2
    display_name: "Purple"
    status: reserved

  - name: extra3
    display_name: "Cyan"
    status: reserved

  - name: extra4
    display_name: "Yellow"
