  # Layer 8: Symbol layer
  - name: symbol
    display_name: "Sym"
    bindings:
      7: trans
      # E, R -> {, }
      17: LBRC
      18: RBRC
      # D, F -> (, )
      31: LPAR
      32: RPAR
      # C, V -> [, ]
      49: LBKT
      50: RBKT
      # B -> <
      51: LT
      # N -> >
      54: GREATER_THAN
      # Right hand home row: H, J, K, L, ; -> -, =, !, &, `
      40: MINUS
      41: EQUAL
      42: EXCLAMATION
      43: AMPS
      44: GRAVE
      # M, comma, dot, / -> ., ,, :, ;
      55: PERIOD
      56: COMMA
      57: COLON
      58: SEMI

  # Layer 9: Vim navigation layer
  - name: vim_nav
    display_name: "Vim"
    bindings:
      # H, J, K, L -> Left, Down, Up, Right
      40: LEFT
      41: DOWN
      42: UP
      43: RIGHT
