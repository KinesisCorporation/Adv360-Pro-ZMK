  # Layer 3: Mod layer (default mapping)
  - name: mod
    display_name: "Mod"
    bindings:
      1: "bt BT_SEL 0"
      2: "bt BT_SEL 1"
      3: "bt BT_SEL 2"
      4: "bt BT_SEL 3"
      5: "bt BT_SEL 4"
      7: trans
