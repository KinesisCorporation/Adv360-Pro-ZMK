# ZMK のマクロ・コンボ機能を有効化
CONFIG_ZMK_MACRO_ENABLE=y
CONFIG_ZMK_COMBO_ENABLE=y
CONFIG_ZMK_HOLD_TAP=y

# Hold-Tap のチューニング（親指中心の Vim 操作向け）
CONFIG_ZMK_HOLD_TAP_FLAVOR_BALANCED=y
CONFIG_ZMK_HOLD_TAP_TAPPING_TERM_MS=200
CONFIG_ZMK_HOLD_TAP_QUICK_TAP_MS=120
CONFIG_ZMK_HOLD_TAP_INTERRUPT_ON_RELEASE=y

# スリープ設定（推奨）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000

